<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPulse | Student Learning Management System</title>
    <meta name="description" content="A modern, comprehensive Student Learning Management System for students, teachers, and administrators." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Ensure trailing slash for GitHub Pages repository subpaths so relative './assets/' load correctly
      (function(l) {
        if (l.pathname.length > 1 && !l.pathname.endsWith('/') && !l.pathname.split('/').pop().includes('.')) {
          l.replace(l.pathname + '/' + l.search + l.hash);
        }
        // Handle redirect from 404.html if refreshed or navigated directly
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
